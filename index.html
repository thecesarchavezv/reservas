<style>
/* =========================================================
   CONFIGURACIÓN DE LA INTERFAZ
   La URL del backend se edita más abajo, en el <script> (API_URL).
   ========================================================= */
:root{
  --blue:#003CFA; --blue-600:#0035E5; --blue-700:#002CD0; --blue-soft:#E7EDFF;
  --cyan:#00FFFF; --turq:#0FDCE1; --turq-soft:#DDFAFB; --turq-ink:#0A7F83;
  --coral:#FF4E50; --coral-ink:#C2373C; --coral-soft:#FFE7E7;
  --lime:#96BE12; --lime-ink:#557008; --lime-soft:#EEF6D6;
  --ink:#343E3E; --ink-2:#5B6565; --fog:#AEB4B4; --line:#E2E6E7;
  --surface:#F3F5F7; --paper:#FFFFFF;
  --font:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  --hour:46px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;line-height:1.2;transition:background .15s, transform .1s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-700)}
.btn-white{background:#fff;color:var(--blue)}
.btn-white:hover{background:var(--blue-soft)}
.btn-ghost-w{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.btn-ghost-w:hover{background:rgba(255,255,255,.12)}
.btn-quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-quiet:hover{background:#fff;box-shadow:inset 0 0 0 1.5px var(--fog)}
.btn-danger{background:transparent;color:var(--coral-ink);box-shadow:inset 0 0 0 1.5px #F3C3C4}
.btn-danger:hover{background:var(--coral-soft)}
.btn-sm{padding:7px 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- Acceso ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-brand{background:var(--blue);color:#fff;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-brand img{width:210px;height:auto}
.login-brand h1{font-size:clamp(34px,4.4vw,58px);line-height:1.02;font-weight:700;letter-spacing:-.02em;margin:0;max-width:11ch}
.login-brand p{font-size:18px;font-weight:300;max-width:34ch;margin:18px 0 0;opacity:.92}
.facets{position:absolute;right:-60px;bottom:-40px;width:420px;opacity:.13;pointer-events:none}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--paper)}
.login-card{width:100%;max-width:380px}
.login-card h2{font-size:26px;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.login-card .sub{color:var(--ink-2);margin:0 0 26px}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field small{display:block;color:var(--ink-2);font-size:13px;margin-top:6px}
.input{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;padding:11px 13px;font-size:16px;transition:border-color .15s}
.input:hover{border-color:var(--fog)}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.code-input{font-size:30px;letter-spacing:12px;text-align:center;font-weight:600}
.form-msg{min-height:22px;font-size:14px;margin:4px 0 12px}
.form-msg.err{color:var(--coral-ink)}
.form-msg.ok{color:var(--lime-ink)}
.login-card .btn{width:100%;padding:13px}
.login-foot{margin-top:22px;font-size:13px;color:var(--ink-2)}

/* ---------- Franja de estado ---------- */
.band{background:var(--blue);color:#fff;padding:0 0 26px}
.topbar{max-width:1240px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:16px}
.topbar img{height:36px;width:auto;display:block}
.topbar .tool{font-size:14px;opacity:.85;border-left:1px solid rgba(255,255,255,.35);padding-left:16px;margin-left:2px}
.topbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;font-size:13px}
.notify-btn{font-size:13px;padding:6px 12px}

.status{max-width:1240px;margin:0 auto;padding:26px 24px 8px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.status-kicker{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;margin-bottom:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(150,190,18,.28)}
.dot.busy{background:var(--coral);box-shadow:0 0 0 4px rgba(255,78,80,.3)}
.dot.mine{background:var(--cyan);box-shadow:0 0 0 4px rgba(0,255,255,.28)}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.status h1{font-size:clamp(34px,5.4vw,64px);line-height:1;font-weight:700;letter-spacing:-.025em;margin:0}
.status p{margin:12px 0 0;font-size:17px;font-weight:300;max-width:60ch;opacity:.95}
.status-side{text-align:right}
.countdown{font-size:clamp(40px,6vw,76px);font-weight:200;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.countdown small{display:block;font-size:14px;font-weight:400;letter-spacing:0;margin-top:8px;opacity:.85}
.status-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

/* Cinta del día */
.ribbon-wrap{max-width:1240px;margin:22px auto 0;padding:0 24px}
.ribbon-head{display:flex;justify-content:space-between;font-size:13px;opacity:.85;margin-bottom:8px}
.ribbon{position:relative;height:46px;background:rgba(255,255,255,.12);border-radius:10px;overflow:hidden;cursor:pointer}
.ribbon .past{position:absolute;top:0;bottom:0;left:0;background:rgba(0,20,90,.28)}
.ribbon .seg{position:absolute;top:6px;bottom:6px;border-radius:6px;background:#fff;color:var(--blue);font-size:12px;font-weight:600;padding:0 8px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.ribbon .seg.mine{background:var(--cyan);color:#00226e}
.ribbon .buf{position:absolute;top:14px;bottom:14px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 3px,transparent 3px 7px)}
.ribbon .now{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan)}
.ribbon .now::before{content:"";position:absolute;top:-1px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--cyan)}
.ticks{position:relative;height:18px;font-size:11px;opacity:.75;margin-top:4px}
.ticks span{position:absolute;transform:translateX(-50%)}

/* ---------- Contenido ---------- */
main{max-width:1240px;margin:0 auto;padding:22px 24px 60px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tabs{display:inline-flex;background:#fff;border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--line)}
.tab{border:0;background:transparent;padding:8px 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.toolbar .spacer{flex:1}
.weeknav{display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-size:18px;color:var(--ink)}
.iconbtn:hover{box-shadow:inset 0 0 0 1px var(--fog)}
.weeklabel{font-weight:700;font-size:16px;min-width:190px;text-align:center}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin:0 0 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}

/* Calendario semanal */
.cal{background:#fff;border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.cal-head{display:grid;grid-template-columns:56px repeat(var(--days),1fr);border-bottom:1px solid var(--line);background:#fff;position:relative;z-index:2}
.cal-head div{padding:10px 8px;text-align:center;font-size:13px;color:var(--ink-2)}
.cal-head b{display:block;font-size:20px;color:var(--ink);font-weight:600;line-height:1.1}
.cal-head .today b{color:#fff;background:var(--blue);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;margin:2px auto 0;font-size:16px}
.cal-head .today{color:var(--blue);font-weight:600}
.cal-body{height:min(64vh,620px);overflow-y:auto;position:relative}
.cal-grid{display:grid;grid-template-columns:56px repeat(var(--days),1fr);position:relative;height:calc(var(--hour) * 24)}
.hours{position:relative}
.hours span{position:absolute;right:8px;font-size:11px;color:var(--fog);transform:translateY(-50%)}
.daycol{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour);cursor:copy}
.daycol.is-past{cursor:default}
.daycol .pastfill{position:absolute;left:0;right:0;top:0;background:rgba(174,180,180,.13);pointer-events:none}
.ev{position:absolute;left:4px;right:4px;border-radius:var(--r-sm);padding:5px 8px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;z-index:2;border:0;text-align:left;display:block}
.ev.other{background:var(--turq-soft);color:#0d4f52;box-shadow:inset 3px 0 0 var(--turq)}
.ev.mine{background:var(--blue);color:#fff}
.ev.done{opacity:.55}
.ev b{display:block;font-size:12.5px}
.ev .t{opacity:.85}
.bufband{position:absolute;left:4px;right:4px;background:repeating-linear-gradient(135deg,rgba(174,180,180,.38) 0 3px,transparent 3px 8px);border-radius:4px;pointer-events:none;z-index:1}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--coral);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--coral)}
.ghost{position:absolute;left:4px;right:4px;border-radius:var(--r-sm);border:2px dashed var(--blue);background:rgba(0,60,250,.06);pointer-events:none;z-index:1;font-size:12px;color:var(--blue);font-weight:600;padding:4px 8px}
.daychips{display:none;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:8px 12px;font-size:13px;min-width:58px;text-align:center;color:var(--ink-2)}
.chip b{display:block;font-size:18px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:none}
.chip[aria-pressed="true"] b{color:#fff}

/* Mis reservas */
.mine-list{display:grid;gap:22px}
.group h3{font-size:15px;margin:0 0 10px;color:var(--ink-2);font-weight:600}
.row{background:#fff;border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line);padding:16px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.row + .row{margin-top:8px}
.row .when{min-width:200px}
.row .when b{font-size:17px;display:block}
.row .when span{color:var(--ink-2);font-size:14px}
.row .note{flex:1;color:var(--ink-2);font-size:14px;min-width:140px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.pill.live{background:var(--lime-soft);color:var(--lime-ink)}
.empty{background:#fff;border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line);padding:42px 24px;text-align:center}
.empty h3{margin:0 0 6px;font-size:19px}
.empty p{margin:0 0 18px;color:var(--ink-2)}

/* ---------- Modales ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,40,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:var(--r-lg);width:100%;max-width:500px;max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 30px 80px rgba(0,20,80,.28)}
@media (prefers-reduced-motion:no-preference){.overlay{animation:fade .16s ease-out}.modal{animation:rise .2s ease-out}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.modal-head{padding:22px 24px 4px;display:flex;align-items:flex-start;gap:12px}
.modal-head h2{margin:0;font-size:22px;letter-spacing:-.01em;flex:1}
.modal-body{padding:12px 24px 8px}
.modal-foot{padding:14px 24px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:var(--surface);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.check{border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin:4px 0 14px}
.check.ok{background:var(--lime-soft);color:var(--lime-ink)}
.check.bad{background:var(--coral-soft);color:var(--coral-ink)}
.sugs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.sug{border:0;border-radius:999px;background:var(--blue-soft);color:var(--blue);padding:7px 13px;font-size:13px;font-weight:600}
.sug:hover{background:#d5e0ff}
.label-sm{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.dur{font-size:14px;color:var(--ink-2);margin:-6px 0 12px}

/* Alerta de fin de turno */
.alert-modal{max-width:440px;text-align:center}
.alert-top{padding:30px 24px 22px;color:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0}
.alert-top.t15{background:var(--turq-ink)}
.alert-top.t5{background:var(--coral-ink)}
.alert-top.tend{background:var(--blue)}
.alert-top .big{font-size:64px;font-weight:200;line-height:1;letter-spacing:-.03em}
.alert-top h2{margin:8px 0 0;font-size:22px}
.alert-body{padding:20px 26px 6px;color:var(--ink-2)}
.alert-body p{margin:0 0 12px}

/* Avisos */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.toast.err{background:var(--coral-ink)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--ink-2)}
.setup{max-width:620px;margin:10vh auto;background:#fff;padding:32px;border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line)}
.setup code{background:var(--surface);padding:2px 6px;border-radius:4px}

/* ---------- Responsivo ---------- */
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-brand{padding:32px 24px;min-height:auto;gap:40px}
  .login-brand img{width:160px}
  .facets{width:260px}
  .status{grid-template-columns:1fr;gap:10px}
  .status-side{text-align:left}
  .status-actions{justify-content:flex-start}
  .weeklabel{min-width:0;font-size:15px}
  .daychips{display:flex}
  .row .when{min-width:0;width:100%}
}
@media (max-width:560px){
  .topbar{padding:14px 16px}
  .topbar .tool{display:none}
  .who .name{display:none}
  .status,.ribbon-wrap,main{padding-left:16px;padding-right:16px}
  .grid3{grid-template-columns:1fr 1fr}
  .grid3 .field:first-child{grid-column:1/-1}
  .toolbar{gap:8px}
  .toolbar .btn-label{display:none}
}
</style>

   Estado
   --------------------------------------------------------- */
const MIN = 60000, DAY = 86400000;
const S = {
  token: lsGet('rap_token'), user: null, reservations: [], config: null, version: 0, offset: 0,
  tab: 'week', weekStart: null, mobileDay: null, loginStep: 'email', loginEmail: lsGet('rap_email') || '',
  modal: null, alert: null, scrollSet: false,
};
let pollTimer = null, tickTimer = null;

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
const now = () => Date.now() + S.offset;
const $ = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------------------------------------------------
   API
   --------------------------------------------------------- */
async function api(action, payload = {}){
  const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action, token: S.token, ...payload }) });
  const j = await res.json();
  if (!j.ok){
    if (j.code === 'AUTH'){ signOut(true); }
    const e = new Error(j.error || 'Algo salió mal.'); e.code = j.code; throw e;
  }
  return j;
}

async function loadState(force){
  const j = await api('state', { version: force ? 0 : S.version });
  S.offset = j.now - Date.now();
  if (!j.unchanged){
    S.version = j.version; S.user = j.user; S.config = j.config; S.reservations = j.reservations;
    return true;
  }
  return false;
}

/* ---------------------------------------------------------
   Fechas
   --------------------------------------------------------- */
const fTime = new Intl.DateTimeFormat('es-MX', { hour:'numeric', minute:'2-digit' });
const fDayLong = new Intl.DateTimeFormat('es-MX', { weekday:'long', day:'numeric', month:'long' });
const fDayShort = new Intl.DateTimeFormat('es-MX', { weekday:'short' });
const fMonth = new Intl.DateTimeFormat('es-MX', { month:'short' });
const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone;
const time = ms => fTime.format(ms).replace(/\s/g,' ').replace(/\.\s?m\./,'. m.');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dayLong = ms => cap(fDayLong.format(ms));
function sod(ms){ const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
function addDays(ms, n){ const d = new Date(ms); d.setDate(d.getDate()+n); return d.getTime(); }
function sow(ms){ const d = new Date(sod(ms)); const dow = (d.getDay()+6)%7; return addDays(d.getTime(), -dow); }
function relDay(ms){
  const t = sod(now()), d = sod(ms);
  if (d === t) return 'Hoy'; if (d === addDays(t,1)) return 'Mañana'; if (d === addDays(t,-1)) return 'Ayer';
  return dayLong(ms);
}
function whenText(ms){ const r = relDay(ms); return (r === 'Hoy' || r === 'Mañana' || r === 'Ayer') ? r.toLowerCase() + ' a las ' + time(ms) : r + ', ' + time(ms); }
function dur(min){ min = Math.round(min); const h = Math.floor(min/60), m = min%60; return (h? h+' h':'') + (h&&m?' ':'') + (m? m+' min':'') || '0 min'; }
function countdownText(ms){ const m = Math.max(0, Math.ceil(ms/MIN)); if (m < 60) return m + ' min'; return Math.floor(m/60) + ' h ' + String(m%60).padStart(2,'0'); }
const dotEnd = s => /\.$/.test(s) ? s : s + '.';
const firstName = n => String(n||'').split(' ')[0];
const initials = n => String(n||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ---------------------------------------------------------
   Reglas (las mismas del servidor, para validar al instante)
   --------------------------------------------------------- */
const cfg = () => S.config || { bufferMin:15, minDurationMin:15, maxDurationMin:240, maxDaysAhead:30, toolName:'la herramienta' };
const isMine = r => S.user && r.email === S.user.email;
function clashWith(start, end, ignoreId){
  const buf = cfg().bufferMin * MIN;
  return S.reservations.find(r => r.id !== ignoreId && start < r.end + buf && end > r.start - buf);
}
function slotError(start, end, existing){
  const c = cfg(), t = now();
  if (!(end > start)) return 'La hora de fin debe ser posterior a la de inicio.';
  const d = (end-start)/MIN;
  if (d < c.minDurationMin) return 'La reserva mínima es de ' + c.minDurationMin + ' minutos.';
  if (d > c.maxDurationMin) return 'La reserva máxima es de ' + dur(c.maxDurationMin) + '.';
  const keeps = existing && existing.start === start && start <= t;
  if (start < t - 15*MIN && !keeps) return 'Esa hora ya pasó.';
  if (end <= t) return 'La hora de fin ya pasó.';
  if (start > t + c.maxDaysAhead*DAY) return 'Solo puedes reservar hasta ' + c.maxDaysAhead + ' días adelante.';
  const k = clashWith(start, end, existing && existing.id);
  if (k) return 'Choca con ' + (isMine(k) ? 'otra reserva tuya' : 'la reserva de ' + k.name) + ' (' + time(k.start) + '–' + time(k.end) + '). Deja ' + c.bufferMin + ' min entre turnos.';
  return '';
}
function freeSlots(from, durMin, count, ignoreId){
  const buf = cfg().bufferMin*MIN, d = durMin*MIN, step = 15*MIN;
  const busy = S.reservations.filter(r => r.id !== ignoreId && r.end > from).map(r => [r.start-buf, r.end+buf]).sort((a,b)=>a[0]-b[0]);
  const out = []; let t = Math.max(from, now());
  t = Math.ceil(t/step)*step;
  for (let g=0; g<3000 && out.length<count; g++){
    const b = busy.find(x => t < x[1] && t + d > x[0]);
    if (b){ t = Math.ceil(b[1]/step)*step; continue; }
    if (t > now() + cfg().maxDaysAhead*DAY) break;
    out.push(t); t += d + buf;
  }
  return out;
}
function currentRes(){ const t = now(); return S.reservations.find(r => r.start <= t && r.end > t); }
function nextRes(){ const t = now(); return S.reservations.filter(r => r.start > t).sort((a,b)=>a.start-b.start)[0]; }

/* ---------------------------------------------------------
   Render principal
   --------------------------------------------------------- */
function render(){
  const app = $('#app');
  if (!API_URL){ app.innerHTML = setupView(); return; }
  if (!S.token){ app.innerHTML = loginView(); bindLogin(); return; }
  if (!S.user){ app.innerHTML = '<div class="loading">Cargando reservas…</div>'; return; }
  const body = $('.cal-body');
  const keepScroll = body ? body.scrollTop : null;
  app.innerHTML = bandView() + '<main>' + toolbarView() + (S.tab === 'week' ? weekView() : mineView()) + '</main>' + modalView() + alertView();
  bindApp();
  const nb = $('.cal-body');
  if (nb){
    if (keepScroll != null && S.scrollSet) nb.scrollTop = keepScroll;
    else { nb.scrollTop = Math.max(0, (Math.min(new Date(now()).getHours(), 18) - 1.5)) * hourPx(); S.scrollSet = true; }
  }
}
const hourPx = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour')) || 46;

function setupView(){

/* ---------- Acceso ---------- */
function loginView(){
  const brand = `<section class="login-brand">
      <img src="${LOGO_BLANCO}" alt="AP Latam">
      <div><h1>Reserva tu turno.</h1><p>Una sola cuenta, todo el equipo. Aparta tu horario y ve en tiempo real cuándo está libre.</p></div>
      <svg class="facets" viewBox="0 0 330 370" aria-hidden="true"><use href="#facets"/></svg>
    </section>`;
  let form;
  if (S.loginStep === 'email'){
    form = `<form class="login-card" id="f-email" novalidate>
      <h2>Entra con tu correo</h2>
      <p class="sub">Te enviaremos un código de 6 dígitos. Sin contraseñas.</p>
      <label class="field"><span>Correo</span><input class="input" id="l-email" type="email" autocomplete="email" inputmode="email" required value="${esc(S.loginEmail)}" placeholder="nombre@aplatam.com"></label>
      <label class="field" id="name-field" ${S.needName ? '' : 'hidden'}><span>Nombre completo</span><input class="input" id="l-name" autocomplete="name" placeholder="Así te verá el equipo"><small>Solo la primera vez.</small></label>
      <div class="form-msg" id="l-msg" role="alert"></div>
      <button class="btn btn-primary" type="submit" id="l-send">Enviarme el código</button>
    </form>`;
  } else {
    form = `<form class="login-card" id="f-code" novalidate>
      <h2>Revisa tu correo</h2>
      <p class="sub">Enviamos un código a <b>${esc(S.loginEmail)}</b>. Puede tardar un minuto; revisa también correo no deseado.</p>
      <label class="field"><span>Código</span><input class="input code-input" id="l-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="······"></label>
      <div class="form-msg" id="l-msg" role="alert"></div>
      <button class="btn btn-primary" type="submit" id="l-verify">Entrar</button>
      <p class="login-foot"><button type="button" class="link" id="l-back">Usar otro correo</button> · <button type="button" class="link" id="l-resend">Reenviar código</button></p>
    </form>`;
  }
  return `<div class="login">${brand}<section class="login-form">${form}</section></div>`;
}

function bindLogin(){
  const msg = (t, ok) => { const m = $('#l-msg'); if (m){ m.textContent = t; m.className = 'form-msg ' + (ok ? 'ok' : 'err'); } };
  const fe = $('#f-email');
  if (fe){
    $('#l-email').focus();
    fe.addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('#l-email').value.trim(), name = ($('#l-name') || {}).value || '';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg('Escribe un correo válido.');
      const b = $('#l-send'); b.disabled = true; b.textContent = 'Enviando…';
      try {
        await api('requestCode', { email, name: name.trim(), tz: tzName });
        S.loginEmail = email; lsSet('rap_email', email); S.loginStep = 'code'; S.needName = false; render();
      } catch(err){
        if (err.code === 'NEED_NAME'){ S.needName = true; $('#name-field').hidden = false; $('#l-name').focus(); }
        msg(err.message); b.disabled = false; b.textContent = 'Enviarme el código';
      }
    });
  }
  const fc = $('#f-code');
  if (fc){
    const ci = $('#l-code'); ci.focus();
    ci.addEventListener('input', () => { ci.value = ci.value.replace(/\D/g,'').slice(0,6); if (ci.value.length === 6) fc.requestSubmit(); });
    fc.addEventListener('submit', async e => {
      e.preventDefault();
      const b = $('#l-verify'); b.disabled = true; b.textContent = 'Verificando…';
      try {
        const j = await api('verifyCode', { email: S.loginEmail, code: ci.value, tz: tzName });
        S.token = j.token; lsSet('rap_token', j.token); S.user = j.user; S.version = 0;
        await start();
      } catch(err){ msg(err.message); b.disabled = false; b.textContent = 'Entrar'; ci.select(); }
    });
    $('#l-back').onclick = () => { S.loginStep = 'email'; render(); };
    $('#l-resend').onclick = async () => {
      try { await api('requestCode', { email: S.loginEmail, tz: tzName }); msg('Te enviamos un código nuevo.', true); }
      catch(err){ msg(err.message); }
    };
  }
}

function signOut(expired){
  if (!expired && S.token) api('logout').catch(()=>{});
  S.token = null; S.user = null; S.version = 0; S.reservations = []; lsSet('rap_token', null);
  S.loginStep = 'email'; clearInterval(pollTimer); clearInterval(tickTimer);
  render();
  if (expired) toast('Tu sesión expiró. Vuelve a entrar.', true);
}

/* ---------- Franja de estado ---------- */
function bandView(){
  const c = cfg(), t = now(), cur = currentRes(), nx = nextRes(), u = S.user;
  let kicker, title, text, side = '', actions;
  if (cur && isMine(cur)){
    kicker = '<span class="dot mine"></span> En uso por ti';
    title = 'Es tu turno';
    text = 'Tienes ' + esc(c.toolName) + ' hasta las ' + dotEnd(time(cur.end)) + ' Al terminar, guarda tu trabajo y cierra sesión.';
    side = `<div class="countdown" aria-live="polite">${countdownText(cur.end - t)}<small>restantes</small></div>`;
    actions = `<button class="btn btn-white" data-act="extend" data-id="${cur.id}">Cambiar hora de fin</button><button class="btn btn-ghost-w" data-act="release" data-id="${cur.id}">Liberar ahora</button>`;
  } else if (cur){
    const free = cur.end + c.bufferMin*MIN;
    kicker = '<span class="dot busy"></span> Ocupada';
    title = 'En uso por ' + esc(firstName(cur.name));
    text = esc(cur.name) + ' la tiene hasta las ' + dotEnd(time(cur.end)) + ' Queda libre para el siguiente turno a partir de las ' + dotEnd(time(free));
    side = `<div class="countdown" aria-live="polite">${countdownText(cur.end - t)}<small>para que termine</small></div>`;
    actions = `<button class="btn btn-white" data-act="new-after">Reservar el siguiente espacio</button>`;
  } else {
    kicker = '<span class="dot"></span> Disponible';
    title = 'Libre ahora';
    if (nx){
      const gapEnd = nx.start - c.bufferMin*MIN;
      const canUse = (gapEnd - t)/MIN;
      text = canUse >= c.minDurationMin
        ? 'Puedes usarla ya, hasta las ' + time(gapEnd) + '. Después sigue ' + (isMine(nx) ? 'tu turno' : 'el turno de ' + esc(firstName(nx.name))) + ', ' + dotEnd(whenText(nx.start))
        : 'El siguiente turno es de ' + (isMine(nx) ? 'ti' : esc(firstName(nx.name))) + ', ' + dotEnd(whenText(nx.start));
    } else text = 'No hay turnos próximos. Aparta tu espacio y empieza cuando quieras.';
    const fitsNow = !nx || (nx.start - c.bufferMin*MIN - t)/MIN >= c.minDurationMin;
    actions = fitsNow
      ? `<button class="btn btn-white" data-act="new-now">Usarla ahora</button><button class="btn btn-ghost-w" data-act="new">Reservar otro horario</button>`
      : `<button class="btn btn-white" data-act="new">Reservar el siguiente espacio</button>`;
  }
  const notif = ('Notification' in window && Notification.permission === 'default')
    ? '<button class="btn btn-ghost-w btn-sm notify-btn" data-act="notify">Activar avisos</button>' : '';
  return `<header class="band">
    <div class="topbar">
      <img src="${LOGO_BLANCO}" alt="AP Latam">
      <span class="tool">Reservas de ${esc(c.toolName)}</span>
      <span class="spacer"></span>
      ${notif}
      <div class="who"><span class="avatar" aria-hidden="true">${esc(initials(u.name))}</span><span class="name">${esc(u.name)}</span>
        <button class="btn btn-ghost-w btn-sm" data-act="logout">Salir</button></div>
    </div>
    <div class="status">
      <div><div class="status-kicker">${kicker}</div><h1>${title}</h1><p>${text}</p></div>
      <div class="status-side">${side}<div class="status-actions">${actions}</div></div>
    </div>
    ${ribbonView()}
  </header>`;
}

function ribbonView(){
  const t = now(), d0 = sod(t);
  const todays = S.reservations.filter(r => r.end > d0 && r.start < addDays(d0,1));
  let h0 = 7, h1 = 22;
  todays.forEach(r => { h0 = Math.min(h0, new Date(Math.max(r.start,d0)).getHours()); h1 = Math.max(h1, Math.ceil((Math.min(r.end, addDays(d0,1)) - d0)/3600000)); });
  h0 = Math.min(h0, new Date(t).getHours()); h1 = Math.max(h1, new Date(t).getHours()+1);
  const a = d0 + h0*3600000, b = d0 + h1*3600000, span = b - a;
  const pct = ms => Math.max(0, Math.min(100, (ms - a) / span * 100));
  const buf = cfg().bufferMin*MIN;
  let segs = '';
  todays.forEach(r => {
    segs += `<div class="buf" style="left:${pct(r.start-buf)}%;width:${pct(r.end+buf)-pct(r.start-buf)}%"></div>`;
    segs += `<div class="seg ${isMine(r)?'mine':''}" style="left:${pct(r.start)}%;width:${pct(r.end)-pct(r.start)}%" title="${esc(r.name)} · ${time(r.start)}–${time(r.end)}">${esc(isMine(r) ? 'Tú' : firstName(r.name))}</div>`;
  });
  let ticks = '';
  const step = (h1-h0) > 14 ? 3 : 2;
  for (let h = Math.ceil(h0/step)*step; h <= h1; h += step){ const p = pct(d0 + h*3600000); if (p > 2 && p < 98) ticks += `<span style="left:${p}%">${h}:00</span>`; }
  return `<div class="ribbon-wrap">
    <div class="ribbon-head"><span>Hoy, ${esc(fDayLong.format(t))}</span><span>${todays.length ? todays.length + (todays.length === 1 ? ' turno' : ' turnos') : 'Sin turnos'}</span></div>
    <div class="ribbon" id="ribbon" data-a="${a}" data-b="${b}" role="img" aria-label="Turnos de hoy">
      <div class="past" style="width:${pct(t)}%"></div>${segs}<div class="now" style="left:${pct(t)}%"></div>
    </div>
    <div class="ticks">${ticks}</div>
  </div>`;
}

/* ---------- Calendario ---------- */
function isNarrow(){ return window.matchMedia('(max-width:860px)').matches; }
function weekView(){
  const t = now(), narrow = isNarrow();
  const days = [];
  for (let i=0;i<7;i++) days.push(addDays(S.weekStart, i));
  if (!S.mobileDay || S.mobileDay < days[0] || S.mobileDay > days[6]) S.mobileDay = days.includes(sod(t)) ? sod(t) : days[0];
  const shown = narrow ? [S.mobileDay] : days;
  const H = hourPx();
  const buf = cfg().bufferMin*MIN;

  const chips = `<div class="daychips">${days.map(d => `<button class="chip" data-day="${d}" aria-pressed="${d===S.mobileDay}">${esc(fDayShort.format(d).replace('.',''))}<b>${new Date(d).getDate()}</b></button>`).join('')}</div>`;
  const head = `<div class="cal-head" style="--days:${shown.length}"><div></div>${shown.map(d => `<div class="${d===sod(t)?'today':''}">${esc(fDayShort.format(d).replace('.',''))}<b>${new Date(d).getDate()}</b></div>`).join('')}</div>`;
  let hours = '';
  for (let h=1; h<24; h++) hours += `<span style="top:${h*H}px">${h}:00</span>`;
  const cols = shown.map(d => {
    const de = addDays(d,1);
    let inner = '';
    if (t > d) inner += `<div class="pastfill" style="height:${Math.min(24, (Math.min(t,de)-d)/3600000)*H}px"></div>`;
    S.reservations.filter(r => r.end + buf > d && r.start - buf < de).forEach(r => {
      const top = Math.max(0,(r.start - d)/3600000*H), bot = Math.min(24*H,(r.end - d)/3600000*H);
      const bt = Math.max(0,(r.start - buf - d)/3600000*H), bb = Math.min(24*H,(r.end + buf - d)/3600000*H);
      inner += `<div class="bufband" style="top:${bt}px;height:${bb-bt}px"></div>`;
      if (r.end > d && r.start < de){
        const mine = isMine(r), h = bot - top;
        inner += `<button class="ev ${mine?'mine':'other'} ${r.end<=t?'done':''}" style="top:${top}px;height:${Math.max(h,18)}px" data-ev="${r.id}" title="${esc(r.name)} · ${time(r.start)}–${time(r.end)}${r.note? ' · '+esc(r.note):''}">
          <b>${esc(mine ? 'Tú' : r.name)}</b>${h > 30 ? `<span class="t">${time(r.start)} – ${time(r.end)}</span>` : ''}${h > 62 && r.note ? `<div class="t">${esc(r.note)}</div>` : ''}</button>`;
      }
    });
    if (t >= d && t < de) inner += `<div class="nowline" style="top:${(t-d)/3600000*H}px"></div>`;
    return `<div class="daycol ${de <= t ? 'is-past':''}" data-col="${d}">${inner}</div>`;
  }).join('');
  return `${chips}
    <div class="legend"><span><i style="background:var(--blue)"></i>Tus turnos</span><span><i style="background:var(--turq-soft);box-shadow:inset 3px 0 0 var(--turq)"></i>Turnos del equipo</span><span><i style="background:repeating-linear-gradient(135deg,rgba(174,180,180,.6) 0 3px,transparent 3px 7px)"></i>Margen de ${cfg().bufferMin} min</span><span>Toca un espacio libre para reservarlo. Horario de tu zona (${esc(tzName.split('/').pop().replace(/_/g,' '))}).</span></div>
    <div class="cal">${head}<div class="cal-body"><div class="cal-grid" style="--days:${shown.length}"><div class="hours">${hours}</div>${cols}</div></div></div>`;
}

/* ---------- Mis reservas ---------- */
function mineView(){
  const t = now();
  const mine = S.reservations.filter(isMine);
  const up = mine.filter(r => r.end > t).sort((a,b)=>a.start-b.start);
  const past = mine.filter(r => r.end <= t).sort((a,b)=>b.start-a.start).slice(0,5);
  if (!up.length && !past.length){
    return `<div class="empty"><h3>Aún no tienes reservas</h3><p>Aparta un horario y el equipo lo verá bloqueado al instante.</p><button class="btn btn-primary" data-act="new">Reservar un turno</button></div>`;
  }
  const groups = {};
  up.forEach(r => { const k = sod(r.start); (groups[k] = groups[k] || []).push(r); });
  const row = (r, isPast) => {
    const live = r.start <= t && r.end > t;
    return `<div class="row">
      <div class="when"><b>${time(r.start)} – ${time(r.end)}</b><span>${dur((r.end-r.start)/MIN)}${isPast ? ' · ' + esc(relDay(r.start)) : ''}</span></div>
      <div class="note">${live ? '<span class="pill live">En curso</span> ' : ''}${esc(r.note || '')}</div>
      ${isPast ? '' : `<div class="acts">
        <button class="btn btn-quiet btn-sm" data-act="ics" data-id="${r.id}">Agregar a mi calendario</button>
        <button class="btn btn-quiet btn-sm" data-act="edit" data-id="${r.id}">Editar</button>
        ${live ? `<button class="btn btn-danger btn-sm" data-act="release" data-id="${r.id}">Liberar ahora</button>` : `<button class="btn btn-danger btn-sm" data-act="cancel" data-id="${r.id}">Cancelar</button>`}
      </div>`}
    </div>`;
  };
  let html = '<div class="mine-list">';
  Object.keys(groups).forEach(k => { html += `<section class="group"><h3>${esc(relDay(+k))}${['Hoy','Mañana'].includes(relDay(+k)) ? ', ' + esc(fDayLong.format(+k)) : ''}</h3>${groups[k].map(r => row(r,false)).join('')}</section>`; });
  if (!up.length) html += `<div class="empty"><h3>No tienes turnos próximos</h3><p>Reserva tu siguiente espacio cuando lo necesites.</p><button class="btn btn-primary" data-act="new">Reservar un turno</button></div>`;
  if (past.length) html += `<section class="group"><h3>Recientes</h3>${past.map(r => row(r,true)).join('')}</section>`;
  return html + '</div>';
}

/* ---------- Modal de reserva ---------- */
function timeOptions(selMs, dayMs, extra){
  const opts = [];
  for (let m=0; m<24*60; m+=15) opts.push(dayMs + m*MIN);
  if (extra != null && !opts.includes(extra) && extra >= dayMs && extra < addDays(dayMs,1)) opts.push(extra);
  opts.sort((a,b)=>a-b);
  return opts.map(ms => `<option value="${ms}" ${ms===selMs?'selected':''}>${time(ms)}</option>`).join('');
}
function endOptions(startMs, selMs){
  const c = cfg(), opts = [];
  for (let m=c.minDurationMin; m<=c.maxDurationMin; m+=15) opts.push(startMs + m*MIN);
  if (selMs && !opts.includes(selMs)) { opts.push(selMs); opts.sort((a,b)=>a-b); }
  return opts.map(ms => `<option value="${ms}" ${ms===selMs?'selected':''}>${time(ms)}${sod(ms)!==sod(startMs)?' (día siguiente)':''} · ${dur((ms-startMs)/MIN)}</option>`).join('');
}
function dateStr(ms){ const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function modalView(){
  const M = S.modal; if (!M) return '';
  const ex = M.id ? S.reservations.find(r => r.id === M.id) : null;
  const t = now(), started = ex && ex.start <= t;
  const err = slotError(M.start, M.end, ex);
  const durMin = (M.end - M.start)/MIN;
  const sugs = freeSlots(Math.max(sod(M.start), t), Math.max(cfg().minDurationMin, Math.min(durMin, cfg().maxDurationMin)), 4, M.id)
    .filter(s => s !== M.start);
  return `<div class="overlay" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="modal-head"><h2 id="m-title">${ex ? 'Editar reserva' : 'Nueva reserva'}</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div>
    <form class="modal-body" id="m-form" novalidate>
      <div class="grid3">
        <label class="field"><span>Día</span><input class="input" type="date" id="m-date" value="${dateStr(M.start)}" min="${dateStr(t)}" max="${dateStr(t + cfg().maxDaysAhead*DAY)}" ${started?'disabled':''}></label>
        <label class="field"><span>Inicio</span><select class="input" id="m-start" ${started?'disabled':''}>${timeOptions(M.start, sod(M.start), M.start)}</select></label>
        <label class="field"><span>Fin</span><select class="input" id="m-end">${endOptions(M.start, M.end)}</select></label>
      </div>
      <div class="check ${err ? 'bad' : 'ok'}" role="status">${err ? esc(err) : '✓ Disponible: ' + esc(whenText(M.start)) + ' a ' + time(M.end) + ' (' + dur(durMin) + ')'}</div>
      ${!started && sugs.length ? `<p class="label-sm">Espacios libres de ${dur(durMin)}</p><div class="sugs">${sugs.map(s => `<button type="button" class="sug" data-sug="${s}">${esc(relDay(s) === 'Hoy' || relDay(s) === 'Mañana' ? relDay(s) : fDayShort.format(s).replace('.','') + ' ' + new Date(s).getDate())} ${time(s)}</button>`).join('')}</div>` : ''}
      <label class="field"><span>Nota (opcional)</span><input class="input" id="m-note" maxlength="200" value="${esc(M.note || '')}" placeholder="¿En qué vas a trabajar?"></label>
    </form>
    <div class="modal-foot">
      <button class="btn btn-quiet" data-act="close">Cerrar</button>
      <button class="btn btn-primary" data-act="save" ${err?'disabled':''}>${ex ? 'Guardar cambios' : 'Reservar'}</button>
    </div>
  </div></div>`;
}

function openNew(start, durMin){
  const t = now();
  durMin = durMin || 60;
  if (start == null){ start = freeSlots(t, durMin, 1)[0] || Math.ceil(t/(15*MIN))*15*MIN; }
  // ajusta la duración al hueco disponible si choca
  let end = start + durMin*MIN;
  const buf = cfg().bufferMin*MIN;
  const nxt = S.reservations.filter(r => r.start - buf >= start).sort((a,b)=>a.start-b.start)[0];
  if (nxt && end > nxt.start - buf && nxt.start - buf - start >= cfg().minDurationMin*MIN){ end = Math.floor((nxt.start - buf)/(15*MIN))*15*MIN; if (end - start < cfg().minDurationMin*MIN) end = nxt.start - buf; }
  S.modal = { id:null, start, end, note:'' };
  render();
}
function openEdit(id){
  const r = S.reservations.find(x => x.id === id); if (!r) return;
  S.modal = { id, start:r.start, end:r.end, note:r.note };
  render();
}

/* ---------- Alertas de fin de turno ---------- */
function alertView(){
  const A = S.alert; if (!A) return '';
  const r = S.reservations.find(x => x.id === A.id) || A.res;
  const c = cfg();
  const next = freeSlots(now(), 60, 3);
  const sugs = next.length ? `<p class="label-sm" style="margin-top:6px">Próximos espacios libres de 1 h</p><div class="sugs" style="justify-content:center">${next.map(s => `<button type="button" class="sug" data-sug-new="${s}">${esc(relDay(s) === 'Hoy' || relDay(s) === 'Mañana' ? relDay(s) : fDayShort.format(s).replace('.','') + ' ' + new Date(s).getDate())} ${time(s)}</button>`).join('')}</div>` : '';
  let top, body, foot;
  if (A.kind === '15'){
    top = `<div class="alert-top t15"><div class="big">15</div><h2>minutos para terminar</h2></div>`;
    body = `<p>Tu turno termina a las <b>${time(r.end)}</b>. Ve cerrando lo que estás haciendo.</p>`;
    foot = `<button class="btn btn-quiet" data-act="close-alert">Entendido</button><button class="btn btn-primary" data-act="extend" data-id="${r.id}">Pedir más tiempo</button>`;
  } else if (A.kind === '5'){
    top = `<div class="alert-top t5"><div class="big">5</div><h2>minutos: guarda tu trabajo</h2></div>`;
    body = `<p><b>Guarda todo y cierra sesión</b> en ${esc(c.toolName)} antes de las ${time(r.end)} para no perder nada.</p><p>¿Te falta tiempo? Agenda otro espacio.</p>${sugs}`;
    foot = `<button class="btn btn-quiet" data-act="close-alert">Ya guardé</button><button class="btn btn-primary" data-act="new-from-alert">Reservar otro turno</button>`;
  } else {
    top = `<div class="alert-top tend"><div class="big">✓</div><h2>Tu turno terminó</h2></div>`;
    body = `<p>Gracias por liberar ${esc(c.toolName)} a tiempo. ¿Quieres apartar tu siguiente espacio?</p>${sugs}`;
    foot = `<button class="btn btn-quiet" data-act="close-alert">Ahora no</button><button class="btn btn-primary" data-act="new-from-alert">Reservar otro turno</button>`;
  }
  return `<div class="overlay"><div class="modal alert-modal" role="alertdialog" aria-modal="true">${top}<div class="alert-body">${body}</div><div class="modal-foot" style="justify-content:center">${foot}</div></div></div>`;
}

function notify(title, body){
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body, icon: $('link[rel=icon]').href, tag: 'rap' }); } catch(e){}
}

function checkAlerts(){
  if (!S.user) return;
  const t = now();
  const mine = S.reservations.filter(r => isMine(r) && r.start <= t && r.end > t - 3*MIN);
  mine.forEach(r => {
    const left = (r.end - t)/MIN, d = (r.end - r.start)/MIN, key = 'rap_al_' + r.id + '_' + r.end;
    const shown = lsGet(key) || '';
    const fire = (kind, title, body) => { lsSet(key, shown + kind); S.alert = { kind, id: r.id, res: r }; S.modal = null; render(); notify(title, body); };
    if (left <= 0 && !shown.includes('e')) fire('e', 'Tu turno terminó', '¿Quieres reservar otro espacio?');
    else if (left > 0 && left <= 5 && !shown.includes('5')) fire('5', 'Quedan 5 minutos', 'Guarda tu trabajo y cierra sesión en ' + cfg().toolName + '.');
    else if (left > 5 && left <= 15 && d >= 25 && !shown.includes('1')) fire('1', 'Tu turno termina en 15 minutos', 'Ve cerrando lo que estás haciendo.');
  });
}

/* ---------- Eventos ---------- */
function bindApp(){
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { S.mobileDay = +b.dataset.day; render(); });
  document.querySelectorAll('[data-ev]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const r = S.reservations.find(x => x.id === b.dataset.ev); if (!r) return;
    if (isMine(r) && r.end > now()) openEdit(r.id);
    else toast(`${isMine(r) ? 'Tu turno' : r.name}: ${time(r.start)}–${time(r.end)}${r.note ? ' · ' + r.note : ''}`);
  });
  document.querySelectorAll('[data-col]').forEach(col => col.onclick = e => {
    const d = +col.dataset.col, y = e.clientY - col.getBoundingClientRect().top;
    let st = d + Math.floor(y / hourPx() * 4) * 15*MIN;
    const t = now();
    if (st + 15*MIN <= t) return toast('Ese horario ya pasó.');
    if (st < t) st = Math.floor(t/MIN)*MIN;
    openNew(st, 60);
  });
  const rib = $('#ribbon');
  if (rib) rib.onclick = e => {
    const a = +rib.dataset.a, b = +rib.dataset.b, x = (e.clientX - rib.getBoundingClientRect().left) / rib.offsetWidth;
    let st = Math.floor((a + x*(b-a)) / (15*MIN)) * 15*MIN; const t = now();
    if (st + 15*MIN <= t) return; if (st < t) st = Math.floor(t/MIN)*MIN;
    openNew(st, 60);
  };
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = e => { e.preventDefault(); action(b.dataset.act, b.dataset.id); });
  document.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { const s = +b.dataset.sug, d = S.modal.end - S.modal.start; S.modal.start = s; S.modal.end = s + d; S.modal.note = $('#m-note').value; render(); });
  document.querySelectorAll('[data-sug-new]').forEach(b => b.onclick = () => { S.alert = null; openNew(+b.dataset.sugNew, 60); });
  const ov = $('.overlay[data-close]');
  if (ov) ov.addEventListener('mousedown', e => { if (e.target === ov) { S.modal = null; render(); } });
  const f = $('#m-form');
  if (f){
    const keepNote = () => { S.modal.note = $('#m-note').value; };
    $('#m-date').onchange = e => { keepNote(); const [y,m,dd] = e.target.value.split('-').map(Number); if (!y) return; const old = new Date(S.modal.start); const n = new Date(y, m-1, dd, old.getHours(), old.getMinutes()).getTime(); const d = S.modal.end - S.modal.start; S.modal.start = n; S.modal.end = n + d; render(); };
    $('#m-start').onchange = e => { keepNote(); const d = S.modal.end - S.modal.start; S.modal.start = +e.target.value; S.modal.end = S.modal.start + d; render(); };
    $('#m-end').onchange = e => { keepNote(); S.modal.end = +e.target.value; render(); };
    f.onsubmit = e => { e.preventDefault(); action('save'); };
  }
}

async function action(act, id){
  const t = now();
  switch (act){
    case 'logout': return signOut(false);
    case 'notify': if ('Notification' in window) { await Notification.requestPermission(); render(); if (Notification.permission === 'granted') toast('Listo: te avisaremos 15 y 5 minutos antes de que termine tu turno.'); } return;
    case 'prev': S.weekStart = addDays(S.weekStart, -7); S.mobileDay = null; return render();
    case 'next': S.weekStart = addDays(S.weekStart, 7); S.mobileDay = null; return render();
    case 'today': S.weekStart = sow(t); S.mobileDay = sod(t); S.scrollSet = false; return render();
    case 'new': return openNew(null, 60);
    case 'new-now': return openNew(Math.floor(t/MIN)*MIN, 60);
    case 'new-after': { const cur = currentRes(); return openNew(freeSlots(cur ? cur.end : t, 60, 1)[0], 60); }
    case 'new-from-alert': S.alert = null; return openNew(null, 60);
    case 'close': S.modal = null; return render();
    case 'close-alert': S.alert = null; return render();
    case 'edit': case 'extend': S.alert = null; return openEdit(id);
    case 'ics': return downloadIcs(S.reservations.find(r => r.id === id));
    case 'csv': return downloadCsv();
    case 'cancel': {
      const r = S.reservations.find(x => x.id === id);
      if (!r || !confirm('¿Cancelar tu reserva de ' + whenText(r.start) + '?')) return;
      return mutate('cancel', { id }, 'Reserva cancelada.');
    }
    case 'release': {
      if (!confirm('¿Liberar la herramienta ahora? Tu turno terminará en este momento.')) return;
      return mutate('release', { id }, 'Listo, la herramienta quedó libre para el equipo.');
    }
    case 'save': {
      const M = S.modal; if (!M) return;
      M.note = ($('#m-note') || {}).value || '';
      const ex = M.id ? S.reservations.find(r => r.id === M.id) : null;
      const err = slotError(M.start, M.end, ex); if (err) return toast(err, true);
      const btn = $('[data-act=save]'); if (btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }
      const ok = await mutate(M.id ? 'update' : 'create', { id: M.id, start: M.start, end: M.end, note: M.note }, M.id ? 'Cambios guardados.' : 'Reservado: ' + whenText(M.start) + ' a ' + time(M.end));
      if (ok) { S.modal = null; render(); }
      else if (btn){ btn.disabled = false; btn.textContent = M.id ? 'Guardar cambios' : 'Reservar'; }
      return;
    }
  }
}

async function mutate(act, payload, okMsg){
  try {
    await api(act, payload);
    await loadState(true);
    render(); toast(okMsg);
    return true;
  } catch(err){
    toast(err.message, true);
    try { await loadState(true); render(); } catch(e){}
    return false;
  }
}

/* ---------- Exportar ---------- */
function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function downloadCsv(){
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const fd = new Intl.DateTimeFormat('es-MX', { year:'numeric', month:'2-digit', day:'2-digit' });
  const rows = [['Nombre','Correo','Fecha','Inicio','Fin','Duración (min)','Nota']];
  S.reservations.slice().sort((a,b)=>a.start-b.start).forEach(r => rows.push([r.name, r.email, fd.format(r.start), time(r.start), time(r.end), Math.round((r.end-r.start)/MIN), r.note]));
  download('reservas-' + dateStr(now()) + '.csv', '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('CSV descargado con ' + (rows.length-1) + ' reservas.');
}
function downloadIcs(r){
  if (!r) return;
  const z = ms => new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const tool = cfg().toolName;
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AP Latam//Reservas//ES','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:rap-' + r.id + '@aplatam', 'DTSTAMP:' + z(Date.now()), 'DTSTART:' + z(r.start), 'DTEND:' + z(r.end),
    'SUMMARY:Turno en ' + tool, 'DESCRIPTION:' + (r.note ? r.note.replace(/[,;\\]/g, m => '\\' + m) + '\\n' : '') + 'Reserva hecha en ' + location.href.split('?')[0],
    'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY','DESCRIPTION:Tu turno termina en 15 minutos','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  download('turno-' + dateStr(r.start) + '.ics', ics, 'text/calendar;charset=utf-8');
}

/* ---------- Aviso breve ---------- */
let toastTimer;
function toast(msg, err){
  let t = $('.toast'); if (t) t.remove();
  t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), err ? 6000 : 3500);
}

/* ---------- Arranque ---------- */
async function refresh(){
  if (!S.token || document.hidden) return;
  try { const changed = await loadState(false); if (changed && !S.modal) render(); } catch(e){}
}
function tick(){
  if (!S.user) return;
  checkAlerts();
  if (!S.modal && !S.alert) {
    // refresca la franja (cuenta regresiva y línea de "ahora") sin perder el scroll
    const band = $('.band');
    if (band){ const tmp = document.createElement('div'); tmp.innerHTML = bandView(); band.replaceWith(tmp.firstElementChild); bindApp(); }
  }
}
async function start(){
  S.weekStart = sow(Date.now());
  render();
  try { await loadState(true); }
  catch(err){ if (!S.token) return; $('#app').innerHTML = `<div class="setup"><h2>No pudimos conectar</h2><p>${esc(err.message)}</p><button class="btn btn-primary" onclick="location.reload()">Reintentar</button></div>`; return; }
  S.weekStart = sow(now());
  render();
  checkAlerts();
  if (new URLSearchParams(location.search).get('reservar')) { history.replaceState(null,'',location.pathname); openNew(null, 60); }
  clearInterval(pollTimer); clearInterval(tickTimer);
  pollTimer = setInterval(refresh, POLL_MS);
  tickTimer = setInterval(tick, 15000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.modal || S.alert)) { S.modal = null; S.alert = null; render(); } });
let lastNarrow = isNarrow();
window.addEventListener('resize', () => { if (isNarrow() !== lastNarrow){ lastNarrow = isNarrow(); if (S.user && !S.modal) render(); } });

if (!API_URL) render(); else if (S.token) start(); else render();
</script>
